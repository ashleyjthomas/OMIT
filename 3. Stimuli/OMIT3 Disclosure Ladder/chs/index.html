<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMIT3 — Story Friends (test runner)</title>
<!-- Standalone runner for testing the task outside CHS. Query params:
     ?version=V1..V8   force a version (default: random)
     &why=all|friend|none  Why? prompts after every DV, only better-friends (default), or never
     &base=<url>       asset base (default: this folder)
     &dl=1             download the data CSV at the end -->
<script src="https://cdn.jsdelivr.net/npm/jspsych@7.3.4/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-preload@1.1.3/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-button-response@1.2.0/dist/index.browser.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspsych@7.3.4/css/jspsych.css">
<script src="dist/omit3_task.bundle.js"></script>
<style>body{margin:0;background:#fff;} .jspsych-content-wrapper{padding:0;}</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
const base = q.get('base') || '';
const jsPsych = initJsPsych({
  on_finish: () => {
    const rows = jsPsych.data.get().filter({ trial_type: 'omit3-scene' });
    if (q.get('dl') === '1') rows.localSave('csv', 'omit3_test_' + built.version + '.csv');
    document.body.innerHTML = '<pre style="padding:16px;font:13px/1.4 monospace">' + rows.csv() + '</pre>';
    window.OMIT3_DONE = true;
  }
});
const built = OMIT3.buildTimeline(jsPsych, { baseUrl: base, version: q.get('version') || undefined, why: q.get('why') || 'friend', video: { mid: base + 'video/mid.mp4' } });
window.OMIT3_BUILT = built;
const lists = OMIT3.assetLists();
const tl = [];
if (window.jsPsychPreload) tl.push({ type: jsPsychPreload, images: lists.images, audio: lists.audio, show_progress_bar: true, continue_after_error: true });
tl.push({ type: jsPsychHtmlButtonResponse, stimulus: '<h2>OMIT3 test runner</h2><p>Version <b>' + built.version + '</b>. Click to start (this click also unlocks audio).</p>', choices: ['Start'] });
tl.push(...built.timeline);
jsPsych.run(tl);
</script>
</body>
</html>
